name: Offset moduli transfer checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: offset-moduli-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  exact-and-numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned symbolic and numerical dependencies
        run: python3 -m pip install sympy==1.14.0 mpmath==1.3.0
      - name: Exact finite checks and physical moduli tests (not Lean certification)
        run: python3 moduli_transfer/verify_moduli_transfer.py --out verification/moduli_transfer/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offset-moduli-transfer-evidence
          path: verification/moduli_transfer/
          if-no-files-found: warn
          retention-days: 30
