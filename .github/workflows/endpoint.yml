name: Offset endpoint reformulation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: endpoint-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Lean and dependencies
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan.sh"
          bash "$RUNNER_TEMP/elan.sh" -y --default-toolchain "$(cat lean-toolchain)"
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
      - name: Compile, audit, independently recheck and reject false controls
        run: |
          python3 scripts/verify_endpoint.py
          python3 scripts/verify_endpoint_progress.py
          python3 scripts/verify_offset_completion.py
          python3 scripts/verify_laurent_boundary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offset-endpoint-proof-evidence
          path: verification/
          if-no-files-found: warn
          retention-days: 30
