name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # The Lean build succeeds, then actions/cache/save fills the runner disk
      # writing the .lake tarball, which fails the JOB and SKIPS leanchecker and
      # axiom-audit. Reclaim the preinstalled toolchains we never use so the
      # cache save has room and the audit gates actually run.
      - name: free runner disk before the Lean cache save
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: resolve pinned dependencies
        run: lake update

      - name: build, recheck, and audit proofs
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          use-mathlib-cache: true
          build: true
          leanchecker: true
          leanchecker-args: OperatorFirst
          axiom-audit: true
          axiom-audit-allow: propext,Classical.choice,Quot.sound
