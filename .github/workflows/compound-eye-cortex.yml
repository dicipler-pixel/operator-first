name: Compound Eye Cortex

on:
  push:
    branches: [research/compound-eye-cortex-2026-09-10]
    paths:
      - 'research/compound_eye_cortex_2026_09_10/**'
      - '.github/workflows/compound-eye-cortex.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  meta-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Syntax and finite controls
        run: |
          python3 -m py_compile research/compound_eye_cortex_2026_09_10/cortex.py research/compound_eye_cortex_2026_09_10/lineage.py research/compound_eye_cortex_2026_09_10/theorem_genome.py research/compound_eye_cortex_2026_09_10/planner.py research/compound_eye_cortex_2026_09_10/memory.py research/compound_eye_cortex_2026_09_10/retina_ledger.py research/compound_eye_cortex_2026_09_10/real_ym_allocation_ceiling.py
          cd research/compound_eye_cortex_2026_09_10
          python3 -S test_cortex.py
          python3 -S test_cortex_02.py
          python3 -S test_memory.py
          python3 -S test_retina_ledger.py
      - name: Exercise live-catalog attention, lineage, gap audit and planner
        run: |
          python3 -S research/compound_eye_cortex_2026_09_10/cortex.py attention "projector forcing boundary hidden sector" --top 12 > cortex_attention.json
          python3 -S research/compound_eye_cortex_2026_09_10/cortex.py gaps > cortex_catalog_gaps.json
          python3 -S research/compound_eye_cortex_2026_09_10/lineage.py > cortex_lineage_catalog.json
          python3 -S research/compound_eye_cortex_2026_09_10/planner.py research/compound_eye_cortex_2026_09_10/examples/discriminator_plan.json > cortex_planner_example.json
          python3 -S research/compound_eye_cortex_2026_09_10/memory.py research/compound_eye_cortex_2026_09_10/examples/obstruction_memory.json > cortex_obstruction_example.json
          python3 - <<'PY'
          import json
          x=json.load(open('cortex_attention.json'));g=json.load(open('cortex_catalog_gaps.json'));l=json.load(open('cortex_lineage_catalog.json'));p=json.load(open('cortex_planner_example.json'));m=json.load(open('cortex_obstruction_example.json'));r=json.load(open('research/compound_eye_cortex_2026_09_10/retina_ledger_test_results.json'))
          assert x['catalog_eyes'] >= 191 and x['ranked']
          assert g['eyes_total']==x['catalog_eyes']==l['eyes']==r['registry_eye_versions']
          assert len(g['specified_unimplemented'])==g['status_counts'].get('specified',0)
          assert p['recommended']=='diagnostic_factorial_split'
          assert len(m['applies'])==1 and len(m['does_not_apply'])==1
          assert r['seen_not_surfaced_demo']=='SEEN_BUT_NOT_SURFACED'
          print('catalog',x['catalog_eyes'],'specified',len(g['specified_unimplemented']),'planner',p['recommended'],'miss-demo',r['seen_not_surfaced_demo'])
          PY
      - name: Real two-cube Yang-Mills bottleneck test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.request, zipfile
          expected='d0b24a79e38cc564f31c1d3f205bb5fc3a484ccdff3bc8d5c35bd1cb9a6b73d4'
          url='https://api.github.com/repos/dicipler-pixel/operator-first/actions/artifacts/10127732975/zip'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          data=urllib.request.urlopen(req,timeout=90).read()
          if hashlib.sha256(data).hexdigest()!=expected: raise SystemExit('Pinned Yang-Mills artifact digest changed')
          p=pathlib.Path('/tmp/ym_native.zip');p.write_bytes(data)
          with zipfile.ZipFile(p) as z:
              matrix=z.read('double_cube/matrices.json')
          pathlib.Path('/tmp/double_cube_matrices.json').write_bytes(matrix)
          print('pinned artifact and matrix extracted',len(matrix))
          PY
          python3 -S research/compound_eye_cortex_2026_09_10/real_ym_allocation_ceiling.py --matrix-json /tmp/double_cube_matrices.json --out real_ym_allocation_ceiling.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compound-eye-cortex-evidence
          path: |
            research/compound_eye_cortex_2026_09_10/cortex_test_results.json
            research/compound_eye_cortex_2026_09_10/cortex_02_test_results.json
            research/compound_eye_cortex_2026_09_10/memory_test_results.json
            research/compound_eye_cortex_2026_09_10/retina_ledger_test_results.json
            cortex_attention.json
            cortex_catalog_gaps.json
            cortex_lineage_catalog.json
            cortex_planner_example.json
            cortex_obstruction_example.json
            real_ym_allocation_ceiling.json
