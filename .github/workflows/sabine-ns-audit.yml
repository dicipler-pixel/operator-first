name: Sabine Navier-Stokes non-normal audit theorem

on:
  push:
    branches: [research/compound-eye-cortex-2026-09-10]
    paths:
      - 'research/compound_eye_cortex_2026_09_10/formal_navier_stokes_audit/**'
      - '.github/workflows/sabine-ns-audit.yml'
  pull_request:
    paths:
      - 'research/compound_eye_cortex_2026_09_10/formal_navier_stokes_audit/**'
      - '.github/workflows/sabine-ns-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: sabine-ns-audit-lean433-v1
      - name: Install pinned Lean and Mathlib cache
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl --retry 3 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan.sh"
            bash "$RUNNER_TEMP/elan.sh" -y --default-toolchain "$(cat lean-toolchain)"
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
      - name: Compile theorem and audit source
        run: |
          test -z "$(grep -nE '\bsorry\b|\badmit\b' research/compound_eye_cortex_2026_09_10/formal_navier_stokes_audit/FixedModesResolvent.lean || true)"
          lake env lean research/compound_eye_cortex_2026_09_10/formal_navier_stokes_audit/FixedModesResolvent.lean | tee sabine-ns-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sabine-ns-audit-lean-evidence
          path: sabine-ns-audit.log
          retention-days: 30
