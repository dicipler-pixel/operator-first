name: UPG feedback finite bridge
on:
  push:
    branches:
      - formal/upg-feedback-bridge-2026-09-12
      - formal/upg-adapted-block-equivalence-2026-09-12
      - formal/upg-projector-dynamics-2026-09-13
    paths: ['research/upg/formal/**','.github/workflows/upg-feedback-lean.yml']
  pull_request:
    paths: ['research/upg/formal/**','.github/workflows/upg-feedback-lean.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        working-directory: research/upg/formal
        run: lake update
      - name: Compile, recheck and audit base project
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: research/upg/formal
          use-mathlib-cache: true
          use-github-cache: false
          build: true
          leanchecker: true
          leanchecker-args: UPGFeedback
          axiom-audit: true
          axiom-audit-allow: propext,Classical.choice,Quot.sound
      - name: Independently check projector bridge modules
        working-directory: research/upg/formal
        shell: bash
        run: |
          set -o pipefail
          lake env lean UPGBlockFeedback.lean 2>&1 | tee block-feedback.log
          lake env leanchecker UPGBlockFeedback 2>&1 | tee block-feedback-leanchecker.log
          lake env lean UPGProjectorMetric.lean 2>&1 | tee projector-metric.log
          lake env leanchecker UPGProjectorMetric 2>&1 | tee projector-metric-leanchecker.log
          lake env lean UPGProjectorDynamics.lean 2>&1 | tee projector-dynamics.log
          lake env leanchecker UPGProjectorDynamics 2>&1 | tee projector-dynamics-leanchecker.log
          lake env lean UPGInterfacePersistence.lean 2>&1 | tee interface-persistence.log
          lake env leanchecker UPGInterfacePersistence 2>&1 | tee interface-persistence-leanchecker.log
          lake env lean UPGInterfaceSpectrum.lean 2>&1 | tee interface-spectrum.log
          lake env leanchecker UPGInterfaceSpectrum 2>&1 | tee interface-spectrum-leanchecker.log
          python3 - <<'PY'
          import pathlib,re
          allow={'propext','Classical.choice','Quot.sound'}
          for filename, logfile, expected in [
              ('UPGBlockFeedback.lean','block-feedback.log',7),
              ('UPGProjectorMetric.lean','projector-metric.log',7),
              ('UPGProjectorDynamics.lean','projector-dynamics.log',3),
              ('UPGInterfacePersistence.lean','interface-persistence.log',6),
              ('UPGInterfaceSpectrum.lean','interface-spectrum.log',5),
          ]:
              src=pathlib.Path(filename).read_text()
              log=pathlib.Path(logfile).read_text()
              names=re.findall(r'^\s*theorem\s+([A-Za-z0-9_]+)',src,re.M)
              assert len(names)==expected,(filename,names)
              assert 'sorryAx' not in log and 'Lean.ofReduceBool' not in log
              for name in names:
                  m=re.search(r"'UPGFeedback\."+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",log)
                  assert m,(filename,name)
                  axes={x.strip() for x in m.group(1).split(',') if x.strip()}
                  assert axes <= allow,(name,axes)
              print('Accepted and audited',len(names),filename,'theorems')
          PY
      - name: Reject false zero-memory control
        working-directory: research/upg/formal
        run: |
          if lake env lean FalseControl.lean > false-control.log 2>&1; then
            cat false-control.log
            exit 1
          fi
          grep -q 'unsolved goals' false-control.log
          cat false-control.log
