name: Kakeya integer witness and cut bridges

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kakeya-bridges-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  finite-bridges:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: 2
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Lean and targeted mathlib cache
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          bash /tmp/elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get Mathlib.Algebra.Ring.Rat Mathlib.Algebra.BigOperators.Ring.Finset Mathlib.Data.Int.Cast.Lemmas Mathlib.Algebra.BigOperators.Pi Mathlib.Algebra.BigOperators.GroupWithZero.Action Mathlib.Algebra.BigOperators.Group.Finset.Basic Mathlib.Algebra.Module.Prod Mathlib.LinearAlgebra.Prod Mathlib.Tactic.Ring Mathlib.Tactic.Push Mathlib.Tactic.NormNum
      - name: Compile, recheck kernels, inventory definitions and test refusals
        run: python3 scripts/verify_kakeya_bridges.py
      - name: Seal full replay evidence into the job log
        if: always()
        run: python3 scripts/export_kakeya_receipt.py
      - name: Preserve successful and failed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kakeya-bridges-${{ github.run_id }}-${{ github.sha }}
          path: verification/kakeya_bridges/
          if-no-files-found: warn
          retention-days: 30
