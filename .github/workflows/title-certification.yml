name: Title certification kernels

on:
  push:
    paths:
      - 'research/certification/**'
      - '.github/workflows/title-certification.yml'
  pull_request:
    paths:
      - 'research/certification/**'
      - '.github/workflows/title-certification.yml'

permissions:
  contents: read

jobs:
  lean-title-kernels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update
      - run: lake exe cache get
      - name: Check title certification batch 1 and axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean research/certification/TitleKernelBatch1.lean 2>&1 | tee title-certification-batch1.log
      - name: Check standard mathematics audit and axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean research/certification/StandardMathAudit.lean 2>&1 | tee standard-math-audit.log
      - name: Check recovered math batch A and axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean research/certification/RecoveredMathBatchA.lean 2>&1 | tee recovered-math-batch-a.log
      - name: Check recovered math batch B and axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean research/certification/RecoveredMathBatchB.lean 2>&1 | tee recovered-math-batch-b.log
      - name: Check recovered math batch C and axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean research/certification/RecoveredMathBatchC.lean 2>&1 | tee recovered-math-batch-c.log
      - name: Reject the old 28.26-as-double convention
        shell: bash
        run: |
          cat > /tmp/FalseHarmonicControl.lean <<'EOF'
          import Mathlib
          example : (2 : ℚ) * (1414 / 100 : ℚ) = (2826 / 100 : ℚ) := by
            norm_num
          EOF
          if lake env lean /tmp/FalseHarmonicControl.lean > false-harmonic-control.log 2>&1; then
            echo 'ERROR: false harmonic control unexpectedly compiled'
            cat false-harmonic-control.log
            exit 1
          fi
          grep -Eq 'unsolved goals|tactic.*failed|error:' false-harmonic-control.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: title-certification-lean-audit
          path: |
            title-certification-batch1.log
            standard-math-audit.log
            recovered-math-batch-a.log
            recovered-math-batch-b.log
            recovered-math-batch-c.log
            false-harmonic-control.log
