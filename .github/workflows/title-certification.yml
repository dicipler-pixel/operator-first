name: Title certification kernels

on:
  push:
    paths:
      - 'research/certification/**'
      - '.github/workflows/title-certification.yml'
  pull_request:
    paths:
      - 'research/certification/**'
      - '.github/workflows/title-certification.yml'

permissions:
  contents: read

jobs:
  lean-title-kernels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update
      - run: lake exe cache get
      - name: Check title certification batch 1 and axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean research/certification/TitleKernelBatch1.lean 2>&1 | tee title-certification-lean.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: title-certification-batch1
          path: title-certification-lean.log
