name: Upstream mathlib I2-dihedral bridge

on:
  push:
    branches: [upstream/mathlib-i2-dihedral-2026-09-11]
    paths:
      - 'Mathlib/GroupTheory/Coxeter/Dihedral.lean'
      - '.github/workflows/mathlib-i2-upstream.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staging source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: staging
      - name: Checkout current mathlib master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: master
          persist-credentials: false
          path: mathlib4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            mathlib4/.lake
          key: mathlib-master-i2-dihedral-v1
      - name: Install mathlib toolchain and cache
        working-directory: mathlib4
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl --retry 3 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan.sh"
            bash "$RUNNER_TEMP/elan.sh" -y --default-toolchain "$(cat lean-toolchain)"
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
      - name: Compile proposed file on mathlib master and reject placeholders
        shell: bash
        run: |
          set -euo pipefail
          SRC=staging/Mathlib/GroupTheory/Coxeter/Dihedral.lean
          test -z "$(grep -nE '\bsorry\b|\badmit\b' "$SRC" || true)"
          cp "$SRC" mathlib4/Mathlib/GroupTheory/Coxeter/Dihedral.lean
          cd mathlib4
          lake env lean Mathlib/GroupTheory/Coxeter/Dihedral.lean 2>&1 | tee ../mathlib-i2-upstream.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathlib-i2-upstream-evidence
          path: mathlib-i2-upstream.log
          retention-days: 30
