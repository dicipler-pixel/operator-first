name: Diophantine certificates and controls
on:
  push:
    paths: ['research/diophantine/**', '.github/workflows/diophantine.yml']
  pull_request:
    paths: ['research/diophantine/**', '.github/workflows/diophantine.yml']
permissions:
  contents: read
jobs:
  exact-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/diophantine/requirements.txt
      - run: python research/diophantine/run_experiment.py
      - run: python research/diophantine/verify_diophantine.py --output diophantine-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: diophantine-exact-controls
          path: diophantine-ci.json
  lean-algebra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        working-directory: research/diophantine/formal
        run: lake update
      - name: Build base certificates and audit environment
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: research/diophantine/formal
          use-mathlib-cache: true
          build: true
          leanchecker: true
          leanchecker-args: Certificates
          axiom-audit: true
          axiom-audit-allow: propext,Classical.choice,Quot.sound
      - name: Independently elaborate, leancheck, and audit integrality module
        working-directory: research/diophantine/formal
        shell: bash
        run: |
          set -o pipefail
          lake env lean SectionIntegrality.lean 2>&1 | tee section-integrality.log
          lake env leanchecker SectionIntegrality 2>&1 | tee section-integrality-leanchecker.log
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('section-integrality.log').read_text()
          src=pathlib.Path('SectionIntegrality.lean').read_text()
          names=re.findall(r'^theorem\s+(\w+)',src,re.M)
          assert len(names)==9, names
          assert 'sorryAx' not in text and 'Lean.ofReduceBool' not in text
          allow={'propext','Classical.choice','Quot.sound'}
          for name in names:
              pat=r"'DiophantineEye\."+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]"
              m=re.search(pat,text)
              assert m, name
              axes={x.strip() for x in m.group(1).split(',') if x.strip()}
              assert axes <= allow, (name,axes)
          print('Accepted and audited 9 SectionIntegrality theorems')
          PY
      - name: Reject false integral-section control
        working-directory: research/diophantine/formal
        run: |
          if lake env lean FalseIntegralityControl.lean > false-integrality.log 2>&1; then
            cat false-integrality.log
            exit 1
          fi
          grep -q 'unsolved goals' false-integrality.log
          cat false-integrality.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diophantine-lean-certificates
          path: |
            research/diophantine/formal/lake-manifest.json
            research/diophantine/formal/section-integrality.log
            research/diophantine/formal/section-integrality-leanchecker.log
            research/diophantine/formal/false-integrality.log
