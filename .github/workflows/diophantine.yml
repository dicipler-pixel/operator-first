name: Diophantine certificates and controls
on:
  push:
    paths: ['research/diophantine/**', '.github/workflows/diophantine.yml']
  pull_request:
    paths: ['research/diophantine/**', '.github/workflows/diophantine.yml']
permissions:
  contents: read
jobs:
  exact-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/diophantine/requirements.txt
      - run: python research/diophantine/run_experiment.py
      - run: python research/diophantine/verify_diophantine.py --output diophantine-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: diophantine-exact-controls
          path: diophantine-ci.json
  lean-algebra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        working-directory: research/diophantine/formal
        run: lake update
      - name: Build, independently recheck, and audit axioms
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: research/diophantine/formal
          use-mathlib-cache: true
          build: true
          leanchecker: true
          leanchecker-args: Certificates
          axiom-audit: true
          axiom-audit-allow: propext,Classical.choice,Quot.sound
      - name: Elaborate integrality module explicitly
        working-directory: research/diophantine/formal
        run: lake env lean SectionIntegrality.lean | tee section-integrality.log
      - name: Reject false integral-section control
        working-directory: research/diophantine/formal
        run: |
          if lake env lean FalseIntegralityControl.lean > false-integrality.log 2>&1; then
            cat false-integrality.log
            exit 1
          fi
          grep -q 'unsolved goals' false-integrality.log
          cat false-integrality.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diophantine-lean-certificates
          path: |
            research/diophantine/formal/lake-manifest.json
            research/diophantine/formal/section-integrality.log
            research/diophantine/formal/false-integrality.log
