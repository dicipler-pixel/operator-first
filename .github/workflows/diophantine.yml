name: Diophantine certificates and controls
on:
  push:
    paths: ['research/diophantine/**', '.github/workflows/diophantine.yml']
  pull_request:
    paths: ['research/diophantine/**', '.github/workflows/diophantine.yml']
permissions:
  contents: read
jobs:
  exact-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/diophantine/requirements.txt
      - run: python research/diophantine/run_experiment.py
      - run: python research/diophantine/verify_diophantine.py --output diophantine-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: diophantine-exact-controls
          path: diophantine-ci.json
  lean-algebra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/diophantine/formal
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update
      - run: lake exe cache get Mathlib/Tactic.lean
      - name: Check certificates and report axioms
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee lean-certificates.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diophantine-lean-certificates
          path: research/diophantine/formal/lean-certificates.log
