name: Diophantine certificates and controls
on:
  push:
    paths:
      - 'research/diophantine/**'
      - 'CollatzBarrier.lean'
      - 'CollatzAlignment.lean'
      - 'CollatzRealization.lean'
      - 'CollatzDiophantine.lean'
      - 'collatz_diophantine_exact.py'
      - 'collatz_alignment_exact.py'
      - 'COLLATZ_FORMAL_STATUS.md'
      - '.github/workflows/diophantine.yml'
  pull_request:
    paths:
      - 'research/diophantine/**'
      - 'CollatzBarrier.lean'
      - 'CollatzAlignment.lean'
      - 'CollatzRealization.lean'
      - 'CollatzDiophantine.lean'
      - 'collatz_diophantine_exact.py'
      - 'collatz_alignment_exact.py'
      - 'COLLATZ_FORMAL_STATUS.md'
      - '.github/workflows/diophantine.yml'
permissions:
  contents: read
jobs:
  exact-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/diophantine/requirements.txt
      - run: python research/diophantine/run_experiment.py
      - run: python research/diophantine/verify_diophantine.py --output diophantine-ci.json
      - name: Exact Collatz saturated-barrier regression
        run: python collatz_diophantine_exact.py --limit 10000 --check-known
      - name: Exact Collatz layer-alignment falsification harness
        run: python collatz_alignment_exact.py
      - uses: actions/upload-artifact@v4
        with:
          name: diophantine-exact-controls
          path: diophantine-ci.json
  lean-algebra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/diophantine/formal
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update
      - run: lake exe cache get
      - name: Check existing Diophantine certificates and report axioms
        run: |
          set -o pipefail
          mkdir -p root-logs
          lake build 2>&1 | tee lean-certificates.log
      - name: Compile Collatz prefix barrier module
        run: |
          set -o pipefail
          lake env bash -lc 'cd "$GITHUB_WORKSPACE" && LEAN_PATH="$GITHUB_WORKSPACE:$LEAN_PATH" lean -o CollatzBarrier.olean CollatzBarrier.lean' 2>&1 | tee root-logs/barrier.log
      - name: Compile Collatz phase-survival alignment module
        run: |
          set -o pipefail
          lake env bash -lc 'cd "$GITHUB_WORKSPACE" && LEAN_PATH="$GITHUB_WORKSPACE:$LEAN_PATH" lean -o CollatzAlignment.olean CollatzAlignment.lean' 2>&1 | tee root-logs/alignment.log
      - name: Compile Collatz exact realization cylinders module
        run: |
          set -o pipefail
          lake env bash -lc 'cd "$GITHUB_WORKSPACE" && LEAN_PATH="$GITHUB_WORKSPACE:$LEAN_PATH" lean -o CollatzRealization.olean CollatzRealization.lean' 2>&1 | tee root-logs/realization.log
      - name: Check Collatz Diophantine gap certificates
        run: |
          set -o pipefail
          lake env bash -lc 'cd "$GITHUB_WORKSPACE" && LEAN_PATH="$GITHUB_WORKSPACE:$LEAN_PATH" lean CollatzDiophantine.lean' 2>&1 | tee root-logs/diophantine.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diophantine-lean-certificates
          path: |
            research/diophantine/formal/lean-certificates.log
            research/diophantine/formal/root-logs/
