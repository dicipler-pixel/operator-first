name: Elemental peel observations
on:
  push:
    paths: ['tools/compound-eye/projects/elemental_peel/**', '.github/workflows/elemental-peel.yml']
  pull_request:
    paths: ['tools/compound-eye/projects/elemental_peel/**', '.github/workflows/elemental-peel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  elemental-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/compound-eye/projects/elemental_peel/requirements.txt
      - run: python tools/compound-eye/projects/elemental_peel/run_study.py
      - run: python tools/compound-eye/projects/elemental_peel/extend_observations.py
      - run: python tools/compound-eye/projects/elemental_peel/build_artifacts.py
      - run: python tools/compound-eye/projects/elemental_peel/check_viewer.py
      - run: python scripts/verify_compound_eye_release.py
      - run: python scripts/validate_catalog.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elemental-observation-evidence
          path: |
            tools/compound-eye/projects/elemental_peel/results/summary.json
            tools/compound-eye/projects/elemental_peel/results/extension.json.gz
            tools/compound-eye/projects/elemental_peel/results/viewer_verification.json
