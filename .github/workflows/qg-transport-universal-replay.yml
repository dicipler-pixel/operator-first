name: QG transport-memory Universal 3.2 replay

on:
  push:
    branches: [research/compound-eye-cortex-2026-09-10]
    paths:
      - '.github/workflows/qg-transport-universal-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Compound Eye dependencies
        run: python -m pip install -r tools/compound-eye/requirements.txt
      - name: Replay all five integrated scientific suites and mixer checks
        run: python tools/compound-eye/run_all.py
      - name: Verify synchronized summary
        run: |
          python - <<'PY'
          import json
          p='tools/compound-eye/runs/universal_verification.json'
          x=json.load(open(p))
          assert x['release']=='3.2'
          assert x['registry_and_implementation_hashes_valid'] is True
          assert x['eye_versions']==191
          assert x['sets']==29
          print('Universal',x['release'],'eyes',x['eye_versions'],'sets',x['sets'],'PASS')
          for k in ['qhe','peeling','upg','diophantine','horizon','mixer_ui']:
              print(k, x.get(k))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qg-transport-universal-3-2-replay
          path: |
            tools/compound-eye/runs/universal_verification.json
            tools/compound-eye/runs/qhe/summary.json
            tools/compound-eye/projects/peeling_cascade/verification.json
            tools/compound-eye/projects/upg_integration/verification.json
            tools/compound-eye/projects/diophantine/verification.json
            tools/compound-eye/runs/horizon/summary.json
            tools/compound-eye/runs/mixer/ui_verification.json
          retention-days: 30
