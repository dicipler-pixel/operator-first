name: Light ledger verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: light-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Lean and dependencies
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan.sh"
          bash "$RUNNER_TEMP/elan.sh" -y --default-toolchain "$(cat lean-toolchain)"
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
      - name: Compile, audit and recheck light proofs
        run: python3 scripts/verify_light.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: light-ledger-proof-evidence
          path: verification/light/
          retention-days: 30
