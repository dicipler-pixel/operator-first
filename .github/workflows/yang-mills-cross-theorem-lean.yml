name: Yang Mills cross theorem closing steps
on:
  push:
    branches: [research/yang-mills-2026-09-09, formal/yang-mills-matrix-boundary-2026-09-12, formal/yang-mills-schur-congruence-2026-09-13, formal/yang-mills-nonuniform-tail-gap-2026-09-13]
    paths: ['research/yang_mills_2026_09_09/cross_theorem/lean/**','.github/workflows/yang-mills-cross-theorem-lean.yml']
  pull_request:
    paths: ['research/yang_mills_2026_09_09/cross_theorem/lean/**','.github/workflows/yang-mills-cross-theorem-lean.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/yang_mills_2026_09_09/cross_theorem/lean
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: research/yang_mills_2026_09_09/cross_theorem/lean
          filter: blob:none
      - name: Install Lean
        working-directory: .
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned mathlib environment
        run: |
          set -euo pipefail
          mkdir -p evidence
          lake update > evidence/update.log 2>&1
          lake exe cache get > evidence/cache.log 2>&1
          lake env lean --version > evidence/compiler.txt
          cp lake-manifest.json evidence/
      - name: Build all registered finite roots
        run: |
          set -o pipefail
          lake build 2>&1 | tee evidence/build.log
      - name: Check base cross theorem
        run: |
          set -o pipefail
          lake env lean CrossTheorem.lean 2>&1 | tee evidence/lean.log
      - name: Check matrix-resolved boundary
        run: |
          set -o pipefail
          lake env lean MatrixResolvedBoundary.lean 2>&1 | tee evidence/matrix-lean.log
      - name: Check exact Schur congruence
        run: |
          set -o pipefail
          lake env lean SchurCongruence.lean 2>&1 | tee evidence/schur-lean.log
      - name: Leanchecker Schur congruence
        run: |
          set -o pipefail
          lake env leanchecker SchurCongruence 2>&1 | tee evidence/schur-leanchecker.log
      - name: Check inherited projector, coupling, observability, and dynamics kernels
        run: |
          set -euo pipefail
          for f in ProjectorKernel CouplingFeedback ObservabilityKernel ProjectorDynamics; do
            lake env lean "$f.lean" 2>&1 | tee "evidence/${f}.log"
            lake env leanchecker "$f" 2>&1 | tee "evidence/${f}-leanchecker.log"
          done
      - name: Check nonuniform and overlap tail transfer
        run: |
          set -o pipefail
          lake env lean TailGapTransfer.lean 2>&1 | tee evidence/tail-gap-lean.log
      - name: Leanchecker tail transfer
        run: |
          set -o pipefail
          lake env leanchecker TailGapTransfer 2>&1 | tee evidence/tail-gap-leanchecker.log
      - name: Audit declarations and axioms
        run: |
          set -euo pipefail
          sha256sum CrossTheorem.lean MatrixResolvedBoundary.lean SchurCongruence.lean ProjectorKernel.lean CouplingFeedback.lean ObservabilityKernel.lean ProjectorDynamics.lean TailGapTransfer.lean lean-toolchain lakefile.toml > evidence/source-hashes.txt
          python3 - <<'PY'
          import pathlib,re
          allow={'propext','Classical.choice','Quot.sound'}
          base=[
              ('CrossTheorem.lean','evidence/lean.log','YangMillsCrossTheorem',None),
              ('MatrixResolvedBoundary.lean','evidence/matrix-lean.log','YangMillsCrossTheorem',None),
          ]
          total=0
          for src,log,ns,expected in base:
              source=pathlib.Path(src).read_text(); text=pathlib.Path(log).read_text()
              names=re.findall(r'^\s*theorem\s+([A-Za-z0-9_]+)',source,re.M)
              total += len(names)
              for name in names: assert "'"+ns+"."+name+"'" in text,(src,name)
              for axes in re.findall(r'depends on axioms:\s*\[([^\]]*)\]',text):
                  assert set(x.strip() for x in axes.split(',') if x.strip()) <= allow,(src,axes)
              assert 'sorryAx' not in text and 'Lean.ofReduceBool' not in text,src
          assert total == 17,total
          specs=[
              ('SchurCongruence.lean','evidence/schur-lean.log','CrossTheorem',3),
              ('ProjectorKernel.lean','evidence/ProjectorKernel.log','YangMillsFinite',3),
              ('CouplingFeedback.lean','evidence/CouplingFeedback.log','YangMillsFinite',4),
              ('ObservabilityKernel.lean','evidence/ObservabilityKernel.log','YangMillsFinite',3),
              ('ProjectorDynamics.lean','evidence/ProjectorDynamics.log','YangMillsFinite',7),
              ('TailGapTransfer.lean','evidence/tail-gap-lean.log','CrossTheorem',6),
          ]
          added=0
          for src,log,ns,expected in specs:
              source=pathlib.Path(src).read_text(); text=pathlib.Path(log).read_text()
              names=re.findall(r'^\s*theorem\s+([A-Za-z0-9_]+)',source,re.M)
              assert len(names)==expected,(src,names)
              added += len(names)
              for name in names: assert "'"+ns+"."+name+"'" in text,(src,name)
              for axes in re.findall(r'depends on axioms:\s*\[([^\]]*)\]',text):
                  assert set(x.strip() for x in axes.split(',') if x.strip()) <= allow,(src,axes)
              assert 'sorryAx' not in text and 'Lean.ofReduceBool' not in text,src
          print('Accepted and audited',total+added,'finite declarations across the full tail-transfer stack')
          PY
      - name: Reject a false inequality
        run: |
          set -euo pipefail
          if lake env lean FalseControl.lean > evidence/false-control.log 2>&1; then exit 1; fi
          grep -q 'unsolved goals' evidence/false-control.log
          cat evidence/false-control.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yang-mills-cross-theorem-lean
          path: research/yang_mills_2026_09_09/cross_theorem/lean/evidence/
