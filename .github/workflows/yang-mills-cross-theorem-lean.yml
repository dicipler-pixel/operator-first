name: Yang Mills cross theorem closing steps
on:
  push:
    branches: [research/yang-mills-2026-09-09, formal/yang-mills-matrix-boundary-2026-09-12, formal/yang-mills-schur-congruence-2026-09-13]
    paths: ['research/yang_mills_2026_09_09/cross_theorem/lean/**','.github/workflows/yang-mills-cross-theorem-lean.yml']
  pull_request:
    paths: ['research/yang_mills_2026_09_09/cross_theorem/lean/**','.github/workflows/yang-mills-cross-theorem-lean.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: research/yang_mills_2026_09_09/cross_theorem/lean
          filter: blob:none
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile every finite kernel and audit axioms
        working-directory: research/yang_mills_2026_09_09/cross_theorem/lean
        run: |
          mkdir -p evidence
          lake update > evidence/update.log 2>&1
          lake exe cache get > evidence/cache.log 2>&1
          lake env lean --version > evidence/compiler.txt
          lake build > evidence/build.log 2>&1
          for f in CrossTheorem MatrixResolvedBoundary SchurCongruence ProjectorKernel CouplingFeedback ObservabilityKernel; do
            lake env lean "$f.lean" > "evidence/${f}.log" 2>&1
            lake env leanchecker "$f" > "evidence/${f}-leanchecker.log" 2>&1
            cat "evidence/${f}.log"
          done
          cp lake-manifest.json evidence/
          sha256sum CrossTheorem.lean MatrixResolvedBoundary.lean SchurCongruence.lean ProjectorKernel.lean CouplingFeedback.lean ObservabilityKernel.lean lean-toolchain lakefile.toml > evidence/source-hashes.txt
          python3 - <<'PY'
          import pathlib,re
          allow={'propext','Classical.choice','Quot.sound'}
          specs=[
            ('CrossTheorem.lean','YangMillsCrossTheorem',None),
            ('MatrixResolvedBoundary.lean','YangMillsCrossTheorem',None),
            ('SchurCongruence.lean','CrossTheorem',3),
            ('ProjectorKernel.lean','YangMillsFinite',3),
            ('CouplingFeedback.lean','YangMillsFinite',4),
            ('ObservabilityKernel.lean','YangMillsFinite',3),
          ]
          old_total=0
          for src,ns,expected in specs:
            text=pathlib.Path('evidence/'+src.removesuffix('.lean')+'.log').read_text()
            source=pathlib.Path(src).read_text()
            names=re.findall(r'^\s*theorem\s+([A-Za-z0-9_]+)',source,re.M)
            if expected is not None: assert len(names)==expected,(src,names)
            if src in ('CrossTheorem.lean','MatrixResolvedBoundary.lean'): old_total += len(names)
            for name in names:
              assert "'"+ns+"."+name+"'" in text,(src,name)
            for axes in re.findall(r'depends on axioms:\s*\[([^\]]*)\]',text):
              assert set(x.strip() for x in axes.split(',') if x.strip()) <= allow,(src,axes)
            assert 'sorryAx' not in text and 'Lean.ofReduceBool' not in text,src
          assert old_total==17,old_total
          print('Accepted and audited',old_total+3+3+4+3,'finite Yang-Mills declarations across six modules')
          PY
      - name: Reject a false inequality
        working-directory: research/yang_mills_2026_09_09/cross_theorem/lean
        run: |
          if lake env lean FalseControl.lean > evidence/false-control.log 2>&1; then exit 1; fi
          grep -q 'unsolved goals' evidence/false-control.log
          cat evidence/false-control.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yang-mills-cross-theorem-lean
          path: research/yang_mills_2026_09_09/cross_theorem/lean/evidence/
