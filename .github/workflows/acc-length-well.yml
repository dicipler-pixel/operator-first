name: ACC length-well eye

on:
  push:
    paths:
      - 'ACCWell.lean'
      - 'ACCFrontier.lean'
      - 'ACCSublevelBarrier.lean'
      - 'research/acc/**'
      - '.github/workflows/acc-length-well.yml'
  pull_request:
    paths:
      - 'ACCWell.lean'
      - 'ACCFrontier.lean'
      - 'ACCSublevelBarrier.lean'
      - 'research/acc/**'
      - '.github/workflows/acc-length-well.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-well-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify ac-00015 exact well and accepted controls
        run: python research/acc/length_well_eye.py --verify-ac00015 --calibration

  packed-second-well:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile collision-free packed scanner
        run: g++ -O3 -std=c++17 research/acc/length_well_packed.cpp -o /tmp/length_well_packed
      - name: Reproduce cap-29 second-well closure
        run: /tmp/length_well_packed 29 6000000

  lean-bottleneck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update
      - run: lake exe cache get
      - name: Compile well, frontier, and target-barrier objects in import order
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/ACCWell.olean ACCWell.lean 2>&1 | tee acc-well-lean.log
          lake env lean -o .lake/build/lib/lean/ACCFrontier.olean ACCFrontier.lean 2>&1 | tee acc-frontier-lean.log
          lake env lean -o .lake/build/lib/lean/ACCSublevelBarrier.olean ACCSublevelBarrier.lean 2>&1 | tee acc-sublevel-barrier-lean.log
      - name: Independently recheck compiled modules
        shell: bash
        run: |
          set -euo pipefail
          lake env leanchecker ACCWell 2>&1 | tee acc-well-kernel.log
          lake env leanchecker ACCFrontier 2>&1 | tee acc-frontier-kernel.log
          lake env leanchecker ACCSublevelBarrier 2>&1 | tee acc-sublevel-barrier-kernel.log
      - name: Check external imports and preserve source receipt
        shell: bash
        run: |
          set -euo pipefail
          printf 'import ACCWell\nimport ACCFrontier\nimport ACCSublevelBarrier\n' > ACCImportSmoke.lean
          lake env lean ACCImportSmoke.lean 2>&1 | tee acc-import-smoke.log
          git rev-parse HEAD > acc-source-receipt.txt
          sha256sum ACCWell.lean ACCFrontier.lean ACCSublevelBarrier.lean lakefile.toml lean-toolchain lake-manifest.json >> acc-source-receipt.txt
          git -C .lake/packages/mathlib rev-parse HEAD >> acc-source-receipt.txt
          if grep -E 'sorryAx|Lean.ofReduceBool' acc-well-lean.log acc-frontier-lean.log acc-sublevel-barrier-lean.log; then
            echo 'ERROR: unapproved proof dependency'
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: acc-sublevel-barrier-lean-evidence
          path: |
            acc-*.log
            acc-source-receipt.txt
            ACCWell.lean
            ACCFrontier.lean
            ACCSublevelBarrier.lean
            lakefile.toml
            lean-toolchain
            lake-manifest.json
